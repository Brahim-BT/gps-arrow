name: Shared-points cleanup

# Drains two queues: edits to published points, then withdrawals.
#
# Both queues are unauthenticated writes carrying the secret token the publishing device minted
# for that point and kept locally. Both are honoured only when sha256(token) equals the digest
# stored at owners/<id>, which is a node no client can read. This job exists because that check
# has to happen somewhere that can hash, and Realtime Database rules cannot — they compare
# strings; they cannot verify a preimage. Anyone can WRITE to either queue, because
# unauthenticated clients have to be able to act on their own points and there is nobody to
# authenticate them as. **A queued entry means nothing until this job checks it.**
#
# Four properties this file is responsible for, all easy to break by tidying:
#
#  1. **A hostile queue write costs the owner one cycle and nothing more.** Both queue nodes are
#     create-only, so a stranger can occupy a point's slot with a wrong token and block the
#     owner's write until this runs. That is why every path below FREES THE SLOT — accepted,
#     refused, or nonsensical, the entry is deleted. The owner's device notices on its next sync
#     that the point is still stale or still public, and queues again. Leave an entry in place on
#     any path and that path becomes a permanent denial of edit or withdrawal.
#     Create-only is still the better of the two options: allowing overwrites would let the same
#     attacker clobber a LEGITIMATE entry at any moment right up to drain time, which is the same
#     denial with better timing for them.
#
#  2. **An edit applies `note` as an explicit delete when it is absent.** The edit body always
#     carries a `note` key, null when there is none, and it is applied here as an explicit
#     DELETE of that child rather than left out of the PATCH. A PATCH that omits a key leaves the
#     old value, which would make "remove my note" the one edit that silently does nothing — and
#     it is the edit most likely to be the reason someone edited at all.
#
#  3. **It deletes all THREE nodes on a withdrawal.** sharedPoints/<id>, owners/<id> and
#     tombstones/<id>. Leaving owners/<id> behind makes the id permanently unusable: publishing
#     is one atomic multi-path PATCH whose write to owners/ is create-only, so it would be
#     refused and take the point with it. The device would retry for ever and the user would see
#     "not confirmed yet" for the rest of the point's life.
#
#  4. **An edit to a point that does not exist is refused, not applied.** That is what keeps
#     moderation sticky: a hand-deleted point cannot be brought back through the edit queue any
#     more than it can through the publish path.
#
# Safe to re-run at any time; it only ever acts on what it can prove.
#
# ## Being unconfigured is not a failure, and being half-configured is
#
# Until somebody does the setup there is no database, no secret and nothing to drain. This used
# to authenticate anyway, fail, and go red every fifteen minutes. A check that is permanently red
# is worse than no check: it trains everyone to scroll past red, and this repo's whole
# verification discipline rests on red meaning something. It is the same argument as the checkers
# that could not fail, turned over.
#
# So there is a gate below, and the shape of it matters more than the fact of it:
#
#  - **Nothing configured at all** — no secret, placeholder URL, and the app's own BASE_URL still
#    blank — is a green skip with a line saying so. Nothing has been published, so nothing is
#    owed.
#  - **Anything else short of fully configured is RED.** Half a setup never works, and the
#    dangerous half is real: if the app's BASE_URL is set, users are publishing points and
#    tapping "stop sharing", and a drain that is quietly skipping means those withdrawals never
#    happen. That must shout, not shrug.
#  - **Fully configured cannot reach the skip.** The skip requires every input to be absent, so
#    the moment one is present the gate either proceeds or fails. A workflow that stays green by
#    doing nothing is the failure mode this gate exists to avoid, not one it may fall into.
#
# The gate is a step, not a job-level `if:`, because the `secrets` context is not available in
# `jobs.<id>.if`. It never puts the secret in a shell variable — only the boolean of whether it
# is empty.
on:
  schedule:
    # Every 15 minutes. GitHub's scheduled minimum is 5 and schedules are best-effort — delays
    # of 5-30 minutes are normal at peak — so this buys "usually minutes" rather than a guarantee.
    # Deliberately off the hour, which is the busiest slot. Nothing in the app quotes a number
    # to the user; it reports what it has observed and nothing else.
    #
    # Kept running while unconfigured on purpose. It costs a no-op run and nothing else, and it
    # means the first drain after somebody finishes the setup happens by itself rather than
    # waiting for someone to remember this file exists.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Paste your Realtime Database URL here (see SETUP_SHARED_POINTS.md step 1). One place, read by
  # the gate and both drain steps — it used to be duplicated per step, which is one edit to
  # forget and a half-configured run to debug.
  DB: https://YOUR-PROJECT-default-rtdb.YOUR-REGION.firebasedatabase.app

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      # One file, shallow. The rest of what this job touches lives in Firebase, but the app's own
      # switch is what distinguishes "nobody has set this up" from "users are publishing and
      # their withdrawals are going nowhere", and those must not both be green.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: app/src/main/java/dev/gpsarrow/data/SharedPointsConfig.kt
          sparse-checkout-cone-mode: false

      - name: Check configuration
        id: config
        env:
          # The boolean, never the secret itself.
          HAVE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        run: |
          set -euo pipefail
          CONFIG=app/src/main/java/dev/gpsarrow/data/SharedPointsConfig.kt

          have_db=true
          case "$DB" in *YOUR-PROJECT*|*YOUR-REGION*|"") have_db=false ;; esac

          # The app publishes only when BASE_URL is a non-empty string literal.
          app_publishes=true
          if [ ! -f "$CONFIG" ] || grep -qE '^\s*const val BASE_URL = ""\s*$' "$CONFIG"; then
            app_publishes=false
          fi

          echo "credentials secret present: $HAVE_CREDENTIALS"
          echo "database URL set:           $have_db"
          echo "app BASE_URL set:           $app_publishes"

          if [ "$HAVE_CREDENTIALS" = "true" ] && [ "$have_db" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"

          # The skip is only for a system nobody has touched. Everything else is a real fault.
          if [ "$HAVE_CREDENTIALS" = "false" ] && [ "$have_db" = "false" ] \
             && [ "$app_publishes" = "false" ]; then
            echo "Shared points are not configured, so there is nothing to drain and this run"
            echo "did nothing. Missing: the FIREBASE_SERVICE_ACCOUNT secret, the DB: URL in this"
            echo "file, and SharedPointsConfig.BASE_URL. See SETUP_SHARED_POINTS.md."
            exit 0
          fi

          echo "::error::Shared points are only PARTLY configured, so queued withdrawals and" \
               "edits are not being applied. Missing:"
          [ "$HAVE_CREDENTIALS" = "true" ] || echo "::error::  - the FIREBASE_SERVICE_ACCOUNT repository secret (SETUP_SHARED_POINTS.md step 4)"
          [ "$have_db" = "true" ]          || echo "::error::  - the DB: URL at the top of this workflow (SETUP_SHARED_POINTS.md step 1)"
          if [ "$app_publishes" = "true" ]; then
            echo "::error::The app's BASE_URL IS set, so users can publish points and ask for them"
            echo "::error::to be withdrawn. Until the above is fixed, those requests are ignored."
          fi
          exit 1

      - uses: google-github-actions/auth@v3
        id: auth
        if: steps.config.outputs.configured == 'true'
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          # Without token_format the action only writes a credentials file and this output is
          # empty, so every curl below would send "Authorization: Bearer " and get a 401. The
          # scopes are the two the Realtime Database REST API requires of a service account.
          token_format: 'access_token'
          access_token_scopes: >-
            https://www.googleapis.com/auth/firebase.database,
            https://www.googleapis.com/auth/userinfo.email

      - name: Apply pending edits
        if: steps.config.outputs.configured == 'true'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          edits=$(curl -sSf -H "Authorization: Bearer $TOKEN" "$DB/pendingEdits.json")
          if [ "$edits" = "null" ]; then echo "no pending edits"; exit 0; fi

          # `while IFS= read -r`, not `for id in $(...)`: an id is a UUID today, but the client's
          # own id guard permits spaces, and word-splitting would quietly act on the wrong path.
          echo "$edits" | jq -r 'keys[]' |
          while IFS= read -r id; do
            entry=$(echo "$edits" | jq -c --arg id "$id" '.[$id]')
            offered=$(printf '%s' "$(echo "$entry" | jq -r '.t // ""')" | sha256sum | cut -d' ' -f1)
            stored=$(curl -sSf -H "Authorization: Bearer $TOKEN" "$DB/owners/$id.json" \
                     | jq -r 'select(. != null)')
            point=$(curl -sSf -H "Authorization: Bearer $TOKEN" "$DB/sharedPoints/$id.json")

            # Every branch below deletes the queue entry. See property 1 in the header.
            if [ "$point" = "null" ]; then
              curl -sSf -X DELETE -H "Authorization: Bearer $TOKEN" "$DB/pendingEdits/$id.json"
              echo "::warning::refused edit to $id (no such point) — moderation stays sticky"
              continue
            fi
            if [ -z "$stored" ] || [ "$stored" != "$offered" ]; then
              curl -sSf -X DELETE -H "Authorization: Bearer $TOKEN" "$DB/pendingEdits/$id.json"
              echo "::warning::refused edit to $id (token does not match the owner digest)"
              continue
            fi

            # The three always-present fields. `t` is dropped: it is the proof, not content.
            body=$(echo "$entry" | jq -c '{name, lat, lon}')
            curl -sSf -X PATCH -H "Authorization: Bearer $TOKEN" \
                 -d "$body" "$DB/sharedPoints/$id.json" >/dev/null

            # `note` separately, because absent must mean DELETE and a PATCH cannot say that —
            # omitting the key would leave the old note in place. See property 2 in the header.
            note=$(echo "$entry" | jq -c '.note')
            if [ "$note" = "null" ]; then
              curl -sSf -X DELETE -H "Authorization: Bearer $TOKEN" \
                   "$DB/sharedPoints/$id/note.json"
            else
              curl -sSf -X PUT -H "Authorization: Bearer $TOKEN" \
                   -d "$note" "$DB/sharedPoints/$id/note.json" >/dev/null
            fi

            curl -sSf -X DELETE -H "Authorization: Bearer $TOKEN" "$DB/pendingEdits/$id.json"
            echo "applied edit to $id"
          done

      - name: Drain tombstones
        if: steps.config.outputs.configured == 'true'
        env:
          TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          tombs=$(curl -sSf -H "Authorization: Bearer $TOKEN" "$DB/tombstones.json")
          if [ "$tombs" = "null" ]; then echo "queue empty"; exit 0; fi
          echo "$tombs" | jq -r 'to_entries[] | "\(.key)\t\(.value)"' |
          while IFS=$'\t' read -r id token; do
            point=$(curl -sSf -H "Authorization: Bearer $TOKEN" "$DB/sharedPoints/$id.json")
            if [ "$point" = "null" ]; then
              # Nothing to withdraw. Clear the queue entry and the orphaned digest with it, so a
              # later legitimate re-share of the same id is not blocked by a create-only write.
              curl -sSf -X DELETE -H "Authorization: Bearer $TOKEN" "$DB/owners/$id.json"
              curl -sSf -X DELETE -H "Authorization: Bearer $TOKEN" "$DB/tombstones/$id.json"
              echo "dropped $id (no such point)"
              continue
            fi

            stored=$(curl -sSf -H "Authorization: Bearer $TOKEN" "$DB/owners/$id.json" \
                     | jq -r 'select(. != null)')
            # Lower-case hex, matching ShareToken.hash on the device. `printf %s` so no trailing
            # newline is hashed; `cut` because sha256sum prints "<digest>  -".
            offered=$(printf '%s' "$token" | sha256sum | cut -d' ' -f1)

            if [ -n "$stored" ] && [ "$stored" = "$offered" ]; then
              # All three, and owners LAST: if the run dies between calls, an id that still has
              # its digest is republishable, whereas one that has lost it is not.
              curl -sSf -X DELETE -H "Authorization: Bearer $TOKEN" "$DB/sharedPoints/$id.json"
              curl -sSf -X DELETE -H "Authorization: Bearer $TOKEN" "$DB/pendingEdits/$id.json" || true
              curl -sSf -X DELETE -H "Authorization: Bearer $TOKEN" "$DB/tombstones/$id.json"
              curl -sSf -X DELETE -H "Authorization: Bearer $TOKEN" "$DB/owners/$id.json"
              echo "removed $id"
            else
              # Somebody offered a token that does not hash to the stored digest. That is the
              # scheme working, not a fault: drop the guess and leave the point alone.
              curl -sSf -X DELETE -H "Authorization: Bearer $TOKEN" "$DB/tombstones/$id.json"
              echo "::warning::refused $id (token does not match the owner digest) — point kept"
            fi
          done
