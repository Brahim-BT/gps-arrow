name: Build debug APK

# Push builds on every commit; workflow_dispatch adds a "Run workflow" button on the
# Actions tab so you can rebuild from the browser without making a commit.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # gradle-wrapper.jar is NOT in this repo, so `./gradlew` would fail on its first line.
      # Installing Gradle here and invoking `gradle` directly is the wrapper-less path.
      # setup-gradle also handles dependency and build caching automatically.
      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.3'

      # The hosted runner ships an Android SDK, but don't assume platform 36 is in it.
      # Licences are pre-accepted on the runner image; the `yes |` is belt and braces.
      - name: Install Android SDK platform 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      # Generates gradle-wrapper.jar. Not needed by the steps below (they call `gradle`),
      # but it gets uploaded with the reports so you can drop it into your local checkout
      # and have a working ./gradlew without installing Gradle on your Mac.
      - name: Generate gradle-wrapper.jar
        id: wrapper
        continue-on-error: true
        run: |
          set -o pipefail
          gradle wrapper --gradle-version 8.14.3 --console=plain 2>&1 | tee -a build.log

      # continue-on-error on both build steps is deliberate: a test failure must not stop
      # the APK being built and uploaded, and a compile failure must not stop the log and
      # reports being uploaded. --continue makes Gradle report every failure rather than
      # stopping at the first, which is what you want from a first compile.
      - name: Unit tests (:core:test)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :core:test --console=plain --stacktrace --continue 2>&1 | tee -a build.log

      # Without this the APK is signed with a key AGP invents on the spot, which differs on
      # every run, and Android refuses to install it over an existing app — so each download
      # meant uninstalling and losing the saved destinations. Restored before assembleDebug so
      # the signing config in app/build.gradle.kts can see the file.
      - name: Restore debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 is not set, so this build would be signed with a"
            echo "::error::throwaway key and could not install over an existing app. See TESTING.md."
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ci-debug.keystore
          keytool -list -keystore ci-debug.keystore -storepass android > /dev/null
          echo "signing key restored"

      - name: Build debug APK
        id: apk
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --console=plain --stacktrace --continue 2>&1 | tee -a build.log

      # Puts the errors on the run's summary page so you don't have to open the raw log.
      # Kotlin prefixes compile errors with "e: " — that's what makes this extraction work.
      - name: Summarise result
        if: always()
        run: |
          OUT=app/build/outputs/apk/debug
          shopt -s nullglob
          APKS=("$OUT"/*.apk)
          {
            echo "## Result"
            echo ""
            if [ ${#APKS[@]} -gt 0 ]; then
              echo "**APKs built** — download them from the Artifacts section below."
              echo ""
              echo "> On your phone, take \`app-arm64-v8a-debug.apk\`. On anything else — a car"
              echo "> head unit, a tablet, someone else's device — take \`app-universal-debug.apk\`."
              echo "> It carries every architecture, so it cannot fail to install for want of the"
              echo "> right one, which is what \"App not installed\" usually means."
            else
              echo "**No APK produced.** The build failed — errors are below and in the \`build-reports\` artifact."
            fi
            echo ""
            echo "| step | outcome |"
            echo "| --- | --- |"
            echo "| generate wrapper | ${{ steps.wrapper.outcome }} |"
            echo "| :core:test | ${{ steps.tests.outcome }} |"
            echo "| assembleDebug | ${{ steps.apk.outcome }} |"
            echo ""

            # The whole point of the signing key being stable is that this line never changes.
            # Printed on every run so drift is visible here rather than discovered as a failed
            # install on the phone.
            #
            # apksigner, not `keytool -printcert -jarfile`: minSdk is 26, so AGP signs with the
            # v2/v3 APK schemes and may omit the v1 JAR signature entirely — and keytool can only
            # read v1. It would have printed nothing at all, which looks like "no signature"
            # rather than "wrong tool".
            if [ ${#APKS[@]} -gt 0 ]; then
              APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort | tail -1)
              echo "**Signer** — identical on every build, or the APK will not install over the"
              echo "previous one:"
              echo ""
              echo '```'
              if [ -n "$APKSIGNER" ]; then
                "$APKSIGNER" verify --print-certs "${APKS[0]}" | grep -i "SHA-256 digest" | head -1
              else
                echo "apksigner not found; cannot report the signer"
              fi
              echo '```'
              echo ""

              # The other way an APK refuses to install, and the one that cost three weeks on an
              # Android car head unit: it carries no native library for that device's CPU. The
              # installer says only "App not installed". Reported here for the same reason as the
              # signer digest — visible on the run that built it, rather than in a car park.
              echo "**Architectures** — what each file will install on:"
              echo ""
              echo '```'
              for apk in "${APKS[@]}"; do
                ABIS=$(unzip -l "$apk" | awk '/lib\// { split($4, p, "/"); print p[2] }' | sort -u | tr '\n' ' ')
                printf '%-30s %6s  %s\n' "$(basename "$apk")" \
                  "$(du -h "$apk" | cut -f1)" "${ABIS:-no native libraries}"
              done
              echo '```'
              echo ""
            fi

            if grep -q '^e: ' build.log 2>/dev/null; then
              COUNT=$(grep -c '^e: ' build.log)
              echo "## Kotlin compile errors ($COUNT)"
              echo ""
              echo '```'
              grep '^e: ' build.log \
                | sed "s|file://$GITHUB_WORKSPACE/||" \
                | head -150
              echo '```'
              echo ""
            fi

            if grep -q 'FAILED$' build.log 2>/dev/null; then
              echo "## Failed tasks"
              echo ""
              echo '```'
              grep 'FAILED$' build.log | sort -u | head -40
              echo '```'
              echo ""
            fi

            if grep -q 'What went wrong' build.log 2>/dev/null; then
              echo "## Gradle diagnostics"
              echo ""
              echo '```'
              sed -n '/What went wrong/,/^\* Try:/p' build.log | head -80
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpsarrow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30
          # Tip: add `archive: false` here to download a bare .apk instead of a .zip.
          # Left off by default because the zipped path is the well-trodden one.

      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            build.log
            gradle/wrapper/gradle-wrapper.jar
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 30

      # Runs last, so everything above has already been uploaded. This is what makes the
      # run show a red X when there's no APK, rather than a misleading green tick.
      - name: Fail the run if no APK was produced
        if: always()
        run: |
          # The universal APK specifically: it is the one that installs anywhere, so its absence
          # means either the build failed or the ABI split config stopped producing it.
          if [ ! -f app/build/outputs/apk/debug/app-universal-debug.apk ]; then
            echo "::error::No universal APK was produced. See the run summary for the compile errors."
            exit 1
          fi
          echo "APKs OK:"
          ls -l app/build/outputs/apk/debug/*.apk
